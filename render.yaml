services:
  - type: web
    name: thermalshield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: false
      - key: WEATHER_PROVIDER
        value: open_meteo
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_TRIAL_TEMPLATE
        value: sms_internal_alerts
      - key: EMAIL_PROVIDER
        value: twilio
      - key: TWILIO_EMAIL_FROM
        value: ""
      - key: TWILIO_EMAIL_FROM_NAME
        value: ThermalShield
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: alerts@thermalshield.org

  - type: web
    name: thermalshield-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: thermalshield-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
